version: '3'
services:
  db:
    image: mysql:latest
    container_name: diskusikan-mysql
    ports:
    - "3306:3306"
    environment:
    - MYSQL_ROOT_PASSWORD=superSecretPassword
    - MYSQL_DATABASE=belajar_mysql
    volumes:
    - C:/Users/amnesia/Documents/ProjectCoding/mysql_docker/db:/var/lib/mysql
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: superSecretPassword
    ports:
      - "8080:80"
